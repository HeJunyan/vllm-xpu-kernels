# GEMM SYCL-TLA allow list. Unmatched shapes use oneDNN.
# Loaded once, on the first automatic backend selection in each process.
# Format: M is a single positive integer or an inclusive min-max range.
#   fp8      M,N,K,scale,group_size
#   fp4      M,N,K
#   fp8_bmm  batch,M,N,K,scale,group_size
# scale: fp32 or e8m0. Whitespace, blank lines and # comments are allowed.
# Ranges expand once into exact hash keys. Keep ranges bounded to limit memory.
#
# Active example, not a performance recommendation. SYCL-TLA is currently a
# placeholder: matching this rule raises an error. Comment it out or force
# VLLM_XPU_GEMM_BACKEND=onednn until the backend is implemented.
fp8  1-128,4096,4096,e8m0,32

# Other examples (inactive):
# fp4      128,4096,4096
# fp8_bmm  8,1-256,4096,4096,fp32,128
